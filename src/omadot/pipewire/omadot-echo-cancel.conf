# OmaDot: WebRTC echo cancellation so the assistant does not hear itself through the speakers.
# Installed by `omadot setup echo-cancel`. The daemon records from omadot_aec_source and plays to omadot_aec_sink.
# Your default mic/speakers are untouched. Delete this file to remove it.
context.modules = [
    {   name = libpipewire-module-echo-cancel
        args = {
            library.name = aec/libspa-aec-webrtc
            capture.props = {
                node.name = "omadot_aec_capture"
                node.passive = true
            }
            source.props = {
                node.name = "omadot_aec_source"
                node.description = "OmaDot mic (AEC)"
            }
            sink.props = {
                node.name = "omadot_aec_sink"
                node.description = "OmaDot output (AEC)"
            }
            playback.props = {
                node.name = "omadot_aec_playback"
                node.passive = true
            }
        }
    }
]
